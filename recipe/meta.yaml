{% set name = "pyribs-base" %}
{% set pypi_name = "ribs" %}
{% set version = "0.8.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/ribs-{{ version }}.tar.gz
  sha256: 6bb7941452385fc5bf3e43971123ed54d9c24a606674d14b27bde4a2e38f43de

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - decorator >=4.0.0
    - numba >=0.51.0
    - numpy >=1.17.0
    - pandas >=1.0.0
    - python >=3.6
    - scikit-learn >=0.20
    - scipy >=1.4.0
    - sortedcontainers >=2.0.0
    - threadpoolctl >=2.0.0
    - toml >=0.10.0

test:
  imports:
    - ribs
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/icaros-usc/pyribs
  summary: The pyribs-base package on Conda is DEPRECATED. Please use the pyribs package on Conda instead.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - btjanaka
